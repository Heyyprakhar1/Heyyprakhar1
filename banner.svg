<svg width="100%" viewBox="0 0 860 210" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Prakhar Srivastava — Platform Engineer, DevSecOps, Cloud-Native Infrastructure</title>
  <desc>Terminal-style banner: prakhar@cloud-native ~/ $ whoami — Platform Engineer | Cloud Infrastructure | DevSecOps</desc>

  <defs>
    <clipPath id="banner-clip">
      <rect width="860" height="210" rx="8"/>
    </clipPath>
    <clipPath id="text-l1">
      <rect x="40" y="90" width="0" height="22">
        <animate attributeName="width" from="0" to="600" dur="1.4s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>
    <clipPath id="text-l2">
      <rect x="40" y="114" width="0" height="20">
        <animate attributeName="width" from="0" to="560" dur="1.1s" begin="2.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>
    <clipPath id="text-l3">
      <rect x="40" y="136" width="0" height="20">
        <animate attributeName="width" from="0" to="480" dur="0.9s" begin="3.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#banner-clip)">

    <!-- Background -->
    <rect width="860" height="210" fill="#0d1117"/>

    <!-- Subtle grid -->
    <g opacity="0.035" stroke="#0d9373" stroke-width="0.5">
      <line x1="0" y1="32" x2="860" y2="32"/>
      <line x1="0" y1="64" x2="860" y2="64"/>
      <line x1="0" y1="96" x2="860" y2="96"/>
      <line x1="0" y1="128" x2="860" y2="128"/>
      <line x1="0" y1="160" x2="860" y2="160"/>
      <line x1="0" y1="192" x2="860" y2="192"/>
      <line x1="160" y1="0" x2="160" y2="210"/>
      <line x1="320" y1="0" x2="320" y2="210"/>
      <line x1="480" y1="0" x2="480" y2="210"/>
      <line x1="640" y1="0" x2="640" y2="210"/>
      <line x1="800" y1="0" x2="800" y2="210"/>
    </g>

    <!-- Topology network background (right side, subtle) -->
    <g opacity="0.08" stroke="#0d9373" stroke-width="0.6" fill="none">
      <circle cx="760" cy="100" r="70"/>
      <circle cx="760" cy="100" r="46"/>
      <circle cx="760" cy="100" r="22"/>
      <line x1="690" y1="100" x2="830" y2="100"/>
      <line x1="760" y1="30" x2="760" y2="170"/>
      <line x1="711" y1="51" x2="809" y2="149"/>
      <line x1="809" y1="51" x2="711" y2="149"/>
    </g>
    <g opacity="0.18" fill="#0d9373">
      <circle cx="760" cy="100" r="3.5"/>
      <circle cx="714" cy="100" r="2"/>
      <circle cx="806" cy="100" r="2"/>
      <circle cx="760" cy="54" r="2"/>
      <circle cx="760" cy="146" r="2"/>
      <circle cx="727" cy="67" r="1.5"/>
      <circle cx="793" cy="133" r="1.5"/>
    </g>

    <!-- Scanlines overlay -->
    <rect width="860" height="210" fill="url(#scan)" opacity="0.025"/>

    <!-- Top bar -->
    <rect width="860" height="32" fill="#060c12"/>
    <rect y="32" width="860" height="1" fill="#1a2332"/>

    <!-- Window dots -->
    <circle cx="20" cy="16" r="5" fill="#3a1f1f"/>
    <circle cx="38" cy="16" r="5" fill="#2a2210"/>
    <circle cx="56" cy="16" r="5" fill="#0d3320"/>

    <!-- Top bar label -->
    <text x="430" y="20" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" fill="#2a4a3a" letter-spacing="2">bash — 140×40</text>

    <!-- Right-side top label -->
    <text x="820" y="20" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" fill="#1a3a2a">platform-engineering</text>

    <!-- Prompt line -->
    <text x="40" y="68" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#0d9373" font-weight="600">▶</text>
    <text x="58" y="68" font-family="'JetBrains Mono', monospace" font-size="13" fill="#5dcaa5">prakhar</text>
    <text x="118" y="68" font-family="'JetBrains Mono', monospace" font-size="13" fill="#2a5a3a">@</text>
    <text x="130" y="68" font-family="'JetBrains Mono', monospace" font-size="13" fill="#5dcaa5">cloud-native</text>
    <text x="250" y="68" font-family="'JetBrains Mono', monospace" font-size="13" fill="#2a4a3a">&nbsp;~/&nbsp;</text>
    <text x="286" y="68" font-family="'JetBrains Mono', monospace" font-size="13" fill="#e6edf3">$</text>
    <text x="302" y="68" font-family="'JetBrains Mono', monospace" font-size="13" fill="#9fe1cb">&nbsp;whoami</text>

    <!-- Output line 1 — typed reveal -->
    <text clip-path="url(#text-l1)" x="40" y="107" font-family="'JetBrains Mono', monospace" font-size="14" fill="#e6edf3" font-weight="500">Platform Engineer  |  Cloud Infrastructure  |  DevSecOps</text>

    <!-- Output line 2 -->
    <text clip-path="url(#text-l2)" x="40" y="128" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#5dcaa5">Kubernetes-native · GitOps · Observability-first · Secure Delivery</text>

    <!-- Output line 3 -->
    <text clip-path="url(#text-l3)" x="40" y="148" font-family="'JetBrains Mono', monospace" font-size="11" fill="#3a6a5a">Building secure cloud-native systems. Open to Platform Eng · SRE · AI Infra.</text>

    <!-- Blinking cursor after line 1 -->
    <rect x="40" y="93" width="8" height="14" fill="#0d9373" rx="1">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="x" from="40" to="490" dur="1.4s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>

    <!-- Divider -->
    <line x1="40" y1="166" x2="820" y2="166" stroke="#0d9373" stroke-width="0.5" opacity="0.2"/>

    <!-- Bottom metrics row -->
    <!-- metric 1 -->
    <text x="40" y="181" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#1d5a3a" letter-spacing="1.5">CLUSTER</text>
    <text x="40" y="196" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0d9373" font-weight="500">k8s / kind / EKS</text>

    <!-- Sparkline bars m1 -->
    <g fill="#0d9373" opacity="0.55">
      <rect x="160" y="189" width="4" height="8" rx="1"><animate attributeName="opacity" values="0.4;0.9;0.5;0.8;0.4" dur="2.1s" repeatCount="indefinite"/></rect>
      <rect x="166" y="185" width="4" height="12" rx="1"><animate attributeName="opacity" values="0.6;0.4;0.9;0.5;0.6" dur="1.8s" repeatCount="indefinite"/></rect>
      <rect x="172" y="187" width="4" height="10" rx="1"><animate attributeName="opacity" values="0.5;0.8;0.4;0.9;0.5" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="178" y="183" width="4" height="14" rx="1"><animate attributeName="opacity" values="0.8;0.5;0.7;0.4;0.8" dur="1.9s" repeatCount="indefinite"/></rect>
      <rect x="184" y="186" width="4" height="11" rx="1"><animate attributeName="opacity" values="0.4;0.7;0.9;0.5;0.4" dur="2.2s" repeatCount="indefinite"/></rect>
    </g>

    <!-- metric 2 -->
    <text x="220" y="181" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#1d5a3a" letter-spacing="1.5">DELIVERY</text>
    <text x="220" y="196" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0d9373" font-weight="500">Argo CD · GitOps</text>

    <!-- metric 3 -->
    <text x="390" y="181" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#1d5a3a" letter-spacing="1.5">SECURITY</text>
    <text x="390" y="196" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0d9373" font-weight="500">DevSecOps · Trivy</text>

    <!-- metric 4 -->
    <text x="560" y="181" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#1d5a3a" letter-spacing="1.5">INFRA</text>
    <text x="560" y="196" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0d9373" font-weight="500">Terraform · AWS</text>

    <!-- status dots right side -->
    <circle cx="700" cy="190" r="3.5" fill="#0d9373">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="710" y="194" font-family="'JetBrains Mono', monospace" font-size="9" fill="#1d5a3a">nodes healthy</text>

    <circle cx="700" cy="204" r="3.5" fill="#0d9373">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <text x="710" y="208" font-family="'JetBrains Mono', monospace" font-size="9" fill="#1d5a3a">pipeline synced</text>

    <!-- Border glow -->
    <rect width="860" height="210" rx="8" fill="none" stroke="#0d9373" stroke-width="0.8" opacity="0.2"/>
    <rect x="1" y="1" width="858" height="208" rx="7" fill="none" stroke="#0d9373" stroke-width="0.3" opacity="0.1"/>

  </g>
</svg>
