<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap');

      .bg-rect { animation: none; }

      .line1 { animation: fadeSlideUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.1s both; }
      .line2 { animation: fadeSlideUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.35s both; }
      .line3 { animation: fadeSlideUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.6s both; }
      .line4 { animation: fadeSlideUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.85s both; }
      .line5 { animation: fadeSlideUp 0.7s cubic-bezier(0.22,1,0.36,1) 1.05s both; }

      .cursor { animation: blink 1s step-end infinite 1.4s both; }

      .orb1 { animation: floatOrb1 8s ease-in-out infinite; }
      .orb2 { animation: floatOrb2 10s ease-in-out infinite 2s; }
      .orb3 { animation: floatOrb3 7s ease-in-out infinite 1s; }

      .scanline { animation: scan 4s linear infinite; }

      .grid-fade { animation: gridAppear 1s ease 0.2s both; }

      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        0%,100% { opacity: 1; }
        50%      { opacity: 0; }
      }
      @keyframes floatOrb1 {
        0%,100% { transform: translate(0,0) scale(1); }
        50%     { transform: translate(18px,-22px) scale(1.08); }
      }
      @keyframes floatOrb2 {
        0%,100% { transform: translate(0,0) scale(1); }
        50%     { transform: translate(-14px,16px) scale(0.93); }
      }
      @keyframes floatOrb3 {
        0%,100% { transform: translate(0,0); }
        50%     { transform: translate(10px,12px); }
      }
      @keyframes scan {
        0%   { transform: translateY(-280px); opacity: 0.06; }
        100% { transform: translateY(280px);  opacity: 0.06; }
      }
      @keyframes gridAppear {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
    </style>

    <!-- Deep dark background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#050a14"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </linearGradient>

    <!-- Neon accent gradient for headline -->
    <linearGradient id="headlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ffe0"/>
      <stop offset="55%"  stop-color="#6ee7ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Orb glows -->
    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00ffe0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00ffe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Scanline mask -->
    <clipPath id="clip"><rect width="900" height="280"/></clipPath>

    <!-- Subtle dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="900" height="280" fill="url(#bgGrad)" rx="18"/>

  <!-- Dot grid -->
  <rect class="grid-fade" width="900" height="280" fill="url(#dots)" rx="18"/>

  <!-- Floating orbs -->
  <g clip-path="url(#clip)">
    <ellipse class="orb1" cx="760" cy="60"  rx="140" ry="140" fill="url(#orbA)"/>
    <ellipse class="orb2" cx="100" cy="220" rx="160" ry="160" fill="url(#orbB)"/>
    <ellipse class="orb3" cx="460" cy="290" rx="120" ry="120" fill="url(#orbC)"/>
  </g>

  <!-- Scanline sweep -->
  <g clip-path="url(#clip)">
    <rect class="scanline" x="0" y="0" width="900" height="3" fill="#00ffe0"/>
  </g>

  <!-- Border glow -->
  <rect width="898" height="278" x="1" y="1" rx="17" fill="none"
        stroke="url(#headlineGrad)" stroke-width="1" opacity="0.25"/>

  <!-- Corner accents -->
  <path d="M18,2 L2,2 L2,18"   stroke="#00ffe0" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M882,2 L898,2 L898,18" stroke="#a78bfa" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M18,278 L2,278 L2,262" stroke="#00ffe0" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M882,278 L898,278 L898,262" stroke="#a78bfa" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- === TEXT CONTENT === -->

  <!-- Mono label -->
  <text class="line1" x="52" y="68"
        font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600"
        fill="#00ffe0" opacity="0.7" letter-spacing="3">
    // WELCOME.exe · INITIALIZING...
  </text>

  <!-- Big headline -->
  <text class="line2" x="50" y="128"
        font-family="'Syne', 'JetBrains Mono', monospace" font-size="48" font-weight="800"
        fill="url(#headlineGrad)" letter-spacing="-1">
    Hey there, Explorer 👋
  </text>

  <!-- Subheadline -->
  <text class="line3" x="52" y="168"
        font-family="'JetBrains Mono', monospace" font-size="14.5" font-weight="400"
        fill="#94a3b8" letter-spacing="0.5">
    You just landed on my little corner of the internet.
  </text>

  <!-- Divider line -->
  <line class="line4" x1="52" y1="192" x2="460" y2="192"
        stroke="url(#headlineGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Bottom status line -->
  <text class="line5" x="52" y="218"
        font-family="'JetBrains Mono', monospace" font-size="12" font-weight="400"
        fill="#64748b" letter-spacing="1">
    &gt; Grab a ☕ · Explore the repos · Drop a ⭐ if something sparks joy
  </text>

  <!-- Blinking cursor -->
  <rect class="cursor" x="52" y="232" width="8" height="16" rx="1" fill="#00ffe0" opacity="0.85"/>

  <!-- Visitor badge (right side) -->
  <g class="line2">
    <rect x="700" y="210" width="168" height="36" rx="10"
          fill="#0f172a" stroke="#00ffe0" stroke-width="1" opacity="0.9"/>
    <text x="714" y="233"
          font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600"
          fill="#00ffe0" letter-spacing="1">
      👁  VISITOR COUNT ↓
    </text>
  </g>
</svg>
